<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        body {
            background-color: #f0f4ff; /* Light purplish-blue background */
            color: #333; /* Dark gray text */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .main-container {
            background-color: white;
            width: 60%; /* Reduced width */
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .search-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .search-row {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
            font-size: 1.2rem; /* Increased font size for search box */
        }

        .col-9 input.form-control {
            font-size: 1.2rem; /* Increased input font size */
            padding: 12px; /* Increased padding */
        }

        .col-3 input.btn {
            font-size: 1.2rem; /* Increased button font size */
            padding: 12px; /* Increased padding */
        }

        h1 {
            color: #4b5db6; /* Darker purplish-blue */
            margin-top: 10px;
            text-align: center;
            font-size: 2rem; /* Increased font size */
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        a {
            color: #4b5db6; /* Link color */
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .WeatherInfo {
            text-align: center;
            margin-top: 20px;
        }

        .form-control {
            padding: 10px;
            font-size: 1.2rem;
            border: 1px solid #b3c2ff;
            border-radius: 5px;
        }

        .btn-primary {
            background-color: #6c7bd9;
            border: none;
            color: #fff;
            padding: 12px;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .btn-primary:hover {
            background-color: #5964c3;
        }

        .temperature-container {
            color: #4b5db6;
        }

        .WeatherForecast {
            margin-top: 20px;
        }

        .forecast-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .forecast-table th, .forecast-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #b3c2ff;
        }

        .weather-icon {
            width: 30px;
            height: 30px;
        }

        footer {
            margin-top: 20px;
            text-align: center;
            background-color: #e0e4f8;
            padding: 10px;
            font-size: 14px;
        }

        footer a {
            color: #4b5db6;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="App">
            <div class="container">
                <div class="Weather">
                    <a href="https://www.shecodes.io/" target="_blank" rel="noopener noreferrer">
                        <img src="https://www.inclusionhub.com/hs-fs/hubfs/resource%20logos/SheCodes%20Logo.png?width=1216&height=339&name=SheCodes%20Logo.png" class="logo" alt="SheCodes Logo" height="80px" width="300px">
                    </a>
                    <form id="weather-form" onsubmit="return false;">
                        <div class="search-section">
                            <input type="text" id="city-input" class="form-control" placeholder="Enter a city...">
                            <button class="btn-primary" type="button" onclick="handleWeatherSearch()">Search</button>
                        </div>
                    </form>

                    <!-- Weather Information Section -->
                    <div class="WeatherInfo" id="weather-info">
                        <p>Loading weather data...</p>
                    </div>

                    <!-- Weather Forecast Section with Table Structure -->
                    <div class="WeatherForecast">
                        <table class="forecast-table">
                            <thead>
                                <tr>
                                    <th>Day</th>
                                    <th>Weather</th>
                                    <th>High</th>
                                    <th>Low</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>

                    <footer>
                        This project was coded by 
                        <a href="https://github.com/Nidhiii2" target="_blank" rel="noopener noreferrer">Nidhi Saroj</a> 
                        and is 
                        <a href="https://github.com/Nidhiii2" target="_blank" rel="noopener noreferrer">open-sourced on GitHub</a> 
                        and 
                        <a href="https://github.com/Nidhiii2" target="_blank" rel="noopener noreferrer">hosted on Github</a>
                    </footer>
                </div>
            </div>
        </div>
    </div>

    <script>
        const apiKey = "c2a09d73672d77696bf6916d37d7d6e8"; // Your API Key
        const cityInput = document.getElementById("city-input");
        const weatherInfoDiv = document.querySelector(".WeatherInfo");
        const forecastTableBody = document.querySelector(".forecast-table tbody");

        // Function to fetch current weather
        async function getWeather(city) {
            const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

            try {
                const response = await fetch(weatherUrl);
                const data = await response.json();

                if (data.cod !== 200) {
                    throw new Error(data.message);
                }

                // Update current weather
                weatherInfoDiv.innerHTML = `
                    <h2>${data.name}, ${data.sys.country}</h2>
                    <p>${data.weather[0].description}</p>
                    <p>Temperature: ${data.main.temp}°C</p>
                    <p>Humidity: ${data.main.humidity}%</p>
                    <p>Wind Speed: ${data.wind.speed} m/s</p>
                `;

                // Fetch 5-day forecast
                getForecast(city);
            } catch (error) {
                weatherInfoDiv.innerHTML = `<p>Error: ${error.message}</p>`;
                forecastTableBody.innerHTML = ""; // Clear forecast on error
            }
        }

        // Function to fetch 5-day forecast
        async function getForecast(city) {
            const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${apiKey}&units=metric`;

            try {
                const response = await fetch(forecastUrl);
                const data = await response.json();

                if (data.cod !== "200") {
                    throw new Error(data.message);
                }

                // Clear previous forecast
                forecastTableBody.innerHTML = "";

                // Get unique daily forecasts (every 24 hours)
                const dailyForecasts = {};
                data.list.forEach((item) => {
                    const date = new Date(item.dt * 1000).toLocaleDateString("en-US", { weekday: "short" });
                    if (!dailyForecasts[date]) {
                        dailyForecasts[date] = item;
                    }
                });

                // Populate forecast table
                Object.entries(dailyForecasts).slice(0, 5).forEach(([day, forecast]) => {
                    const iconUrl = `https://openweathermap.org/img/wn/${forecast.weather[0].icon}.png`;

                    forecastTableBody.innerHTML += `
                        <tr>
                            <td>${day}</td>
                            <td><img src="${iconUrl}" alt="${forecast.weather[0].description}" class="weather-icon"></td>
                            <td>${forecast.main.temp_max}°C</td>
                            <td>${forecast.main.temp_min}°C</td>
                        </tr>
                    `;
                });

            } catch (error) {
                forecastTableBody.innerHTML = `<tr><td colspan="4">Error: ${error.message}</td></tr>`;
            }
        }

        // Handle the weather search for the entered city
        function handleWeatherSearch() {
            const city = cityInput.value.trim();
            if (city) {
                getWeather(city);
            }
        }

        // Load default city on page load
        document.addEventListener("DOMContentLoaded", () => {
            getWeather("San Francisco"); // Default city
        });
    </script>
</body>
</html>
